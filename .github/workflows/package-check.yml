name: Package check
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and publish
        required: true
      publish:
        description: Where to publish it
        type: choice
        options: [both, github, wago]
        default: both
permissions:
  contents: read
env:
  ADDON: Buffy
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Fetch pinned libraries
        run: |
          bash tests/fetch_external.sh Libs/LibGlass-1.0 "$RUNNER_TEMP/LibGlass"
          bash tests/fetch_external.sh Libs/LibGroupBuffs-1.0 "$RUNNER_TEMP/LibGroupBuffs"
          echo "LIBGLASS=$RUNNER_TEMP/LibGlass" >> "$GITHUB_ENV"
          echo "LIBGROUPBUFFS=$RUNNER_TEMP/LibGroupBuffs" >> "$GITHUB_ENV"
      # The test scaffolding (assertions, the API mock's mechanics, the
      # build's API lists) at the commit tests/kit.pin names. tests/harness.lua
      # and LibGroupBuffs' shared stub load it through tests/kit.lua, which
      # reads WOWTESTKIT.
      - name: Fetch WowTestKit at its pin
        run: |
          bash tests/fetch_kit.sh "$RUNNER_TEMP/WowTestKit"
          echo "WOWTESTKIT=$RUNNER_TEMP/WowTestKit" >> "$GITHUB_ENV"
      - name: Syntax and behavior
        env:
          FOREVERPROBE_OPTIONAL: "1"   # ForeverProbe is private and local: the probe test runs locally
        run: |
          luac5.1 -p Buffy*.lua Classes/*.lua Tools/BuffyProbe/BuffyProbe.lua "$LIBGROUPBUFFS/LibGroupBuffs.lua"
          for f in tests/test_*.lua; do lua5.1 "$f"; done
      - name: Only the requested tag at HEAD
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for t in $(git tag --points-at HEAD); do
            [ "$t" = "$TAG" ] || git tag -d "$t"
          done
          test "$(git tag --points-at HEAD)" = "$TAG" || { echo "$TAG is not at HEAD"; exit 1; }
      - name: Package without publishing
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d
      - name: Verify exact runtime contents
        run: python3 tests/check_package.py .release/*.zip --lua lua5.1
      - name: Build release notes and release.json
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          zip=$(ls .release/*.zip | head -1)
          tag="$TAG"
          if [ -z "$tag" ]; then
            tag=$(tr -d '\r' < CHANGELOG.md | sed -n 's/^## \(v[^ ]*\).*/\1/p' | head -1)
          fi
          git show "$GITHUB_SHA:tests/release_files.sh" > "$RUNNER_TEMP/release_files.sh"
          bash "$RUNNER_TEMP/release_files.sh" "$tag" "$zip" "$RUNNER_TEMP/release-files"
      - name: Keep checked ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Buffy-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Keep release metadata
        uses: actions/upload-artifact@v4
        with:
          name: Buffy-release-files
          path: ${{ runner.temp }}/release-files/
          if-no-files-found: error

  # One publisher per tag at a time: the tag's push and a manual retry, or two
  # retries, share the group (the same key as TAG below). Two at once could
  # both see a draft, and the second's --clobber would then delete a
  # release.json the first had just published (Codex, wow-dev-tools #57). The
  # one running always finishes. GitHub keeps one waiting job per group: it starts after
  # the running one and finds the release done, and a newer run for the tag
  # cancels it and waits in its place.
  release:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish != 'wago')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Buffy-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Buffy-release-files
          path: out
      - name: Verify tag assets
        run: |
          zip="dist/$ADDON-$TAG-forever.zip"
          test -f "$zip" || { echo "no $zip"; exit 1; }
          jq -e --arg v "$TAG" --arg f "${zip#dist/}" \
            '.releases[0].version == $v and .releases[0].filename == $f' out/release.json > /dev/null
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      # The title is release.json's name: the packaged TOC's Title, colour
      # codes stripped. GitHub renames an asset with characters it doesn't
      # allow (!Bugsy-v0.1.0-forever.zip was stored as Bugsy-v0.1.0-forever.zip),
      # and WowUp picks the asset by release.json's filename: so the zip goes
      # up first, and release.json names it as GitHub stored it (Bugsy #38).
      # Creating a release and uploading each asset are separate requests, so
      # any of them can fail after the others succeeded. The release stays a
      # draft until both assets are there, and a run again (workflow_dispatch)
      # completes whatever an earlier run left: it reuses the release, keeps a
      # zip already uploaded only if it is the package `check` built, uploads
      # release.json if it's missing, then publishes. A published zip that is
      # another package stops the run (Codex, MidnightMinimap #3). A published
      # release.json is never taken away: gh's
      # --clobber deletes the old asset before uploading the new one, so a
      # retry (a manual run defaults to `both`) that failed there would leave a
      # live release without the file WowUp reads (Codex, GlassUI #211). One
      # that matches is kept; one that differs stops the run for a repair by
      # hand. Only a draft's is replaced.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=false
          case "${TAG,,}" in *alpha*|*beta*) pre=true ;; esac
          title="$(jq -r '.releases[0].name' out/release.json) ${TAG#v}"
          repo=(--repo "$GITHUB_REPOSITORY")
          mkdir -p gh
          # The release's uploaded zips, one name a line. The filter is jq's,
          # not a grep with `|| true`: no zip is an empty success, and a
          # failed lookup fails the job (`run` is bash -e) instead of reading
          # as "no zip" (Codex, MidnightMinimap #3).
          stored_zip() {
            gh release view "$TAG" "${repo[@]}" --json assets \
              --jq '.assets[] | select(.state == "uploaded" and (.name | endswith("-forever.zip"))) | .name'
          }
          # The same package: the same file names, each with the same SHA-256
          # of its decompressed bytes. Reading every entry also checks it
          # extracts (its CRC included); one that doesn't is a mismatch.
          # Entry timestamps differ between builds of one commit, so the zips'
          # own bytes are not compared (Codex, MidnightMinimap #3). Each entry
          # must also be stored or deflated: Python reads LZMA and BZIP2 too,
          # but WowUp's extractor (yauzl) takes only those two (Codex,
          # wow-dev-tools #69).
          same_zip() {
            python3 - "$1" "$2" <<'PY'
          import hashlib, sys, zipfile
          def entries(path):
              with zipfile.ZipFile(path) as z:
                  files = [i for i in z.infolist() if not i.is_dir()]
                  for i in files:
                      if i.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED):
                          raise ValueError(f"{i.filename}: compression method {i.compress_type}, not stored or deflated")
                  return sorted((i.filename, hashlib.sha256(z.read(i)).hexdigest()) for i in files)
          try:
              same = entries(sys.argv[1]) == entries(sys.argv[2])
          except Exception as e:
              print(f"unreadable zip: {e}")
              same = False
          sys.exit(0 if same else 1)
          PY
          }
          asset=""
          if gh release view "$TAG" "${repo[@]}" > /dev/null 2>&1; then
            echo "$TAG already has a release: completing it"
            # An upload that failed can leave an empty asset in "starter"
            # state. It still holds its name, and gh refuses to upload over a
            # name that exists, so a retry deletes every unfinished asset
            # first, the zip's or release.json's. Finished assets are kept.
            gh release view "$TAG" "${repo[@]}" --json assets \
              --jq '.assets[] | select(.state != "uploaded") | .apiUrl' |
              while read -r url; do
                echo "deleting an unfinished asset: $url"
                gh api -X DELETE "${url#https://api.github.com/}"
              done
            # A zip already there is kept only if it is the package `check`
            # built and checked: an earlier run's, or one uploaded by hand
            # that matches. Another one is replaced on a draft, and stops the
            # run on a published release, before its title and notes change
            # (Codex, MidnightMinimap #3).
            stored=$(stored_zip)
            if [ "$(printf '%s' "$stored" | grep -c .)" -gt 1 ]; then
              echo "$TAG has more than one zip: $stored"
              echo "Repair by hand: keep one, or delete the release and run again."
              exit 1
            fi
            if [ -n "$stored" ]; then
              gh release download "$TAG" "${repo[@]}" -p "$stored" -O gh/stored.zip --clobber
              if same_zip gh/stored.zip "$ZIP"; then
                echo "keeping $stored: it is the package check built"
                asset="$stored"
              elif [ "$(gh release view "$TAG" "${repo[@]}" --json isDraft --jq .isDraft)" = true ]; then
                echo "replacing the draft's $stored: not the package check built"
                gh release delete-asset "$TAG" "$stored" "${repo[@]}" --yes
              else
                echo "$TAG is published with $stored, which is not the package check built."
                echo "Not replaced. Repair by hand (delete the asset and run again), or delete the release and run again."
                exit 1
              fi
            fi
            gh release edit "$TAG" "${repo[@]}" --title "$title" --notes-file out/notes.md --prerelease="$pre"
          else
            gh release create "$TAG" "${repo[@]}" --verify-tag --draft \
              --title "$title" --notes-file out/notes.md --prerelease="$pre"
          fi
          # The zip release.json names: the stored one verified above, or the
          # one uploaded now, never another lookup's unverified answer.
          if [ -z "$asset" ]; then
            gh release upload "$TAG" "$ZIP" "${repo[@]}"
            asset=$(stored_zip)
            test "$(printf '%s' "$asset" | grep -c .)" = 1 ||
              { echo "expected one -forever.zip on $TAG after the upload, found: ${asset:-none}"; exit 1; }
          fi
          echo "the zip is stored as $asset"
          jq -c --arg f "$asset" '.releases[0].filename = $f' out/release.json > gh/release.json
          cat gh/release.json
          if gh release view "$TAG" "${repo[@]}" --json assets \
               --jq '.assets[] | select(.state == "uploaded") | .name' | grep -qx 'release\.json'; then
            gh release download "$TAG" "${repo[@]}" -p release.json -O gh/stored.json --clobber
            # The whole file, slurped: one JSON document equal to this run's.
            # Without -s, jq -e answers for the last document only, so a file
            # holding two (a repair that appended one) would pass, and WowUp
            # can't parse it (Codex, #61). Invalid JSON fails the test too.
            # jq is lenient, though: it reads 016001 as 16001 and skips a BOM.
            # So the file must first pass JSON.parse, the strict parser WowUp
            # reads it with (Codex, wow-dev-tools #71).
            if node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' gh/stored.json 2> /dev/null &&
               jq -es --slurpfile want gh/release.json 'length == 1 and . == $want' gh/stored.json > /dev/null; then
              echo "keeping the release.json an earlier run uploaded: it is this one"
            elif [ "$(gh release view "$TAG" "${repo[@]}" --json isDraft --jq .isDraft)" = true ]; then
              echo "replacing the draft's release.json"
              gh release upload "$TAG" gh/release.json "${repo[@]}" --clobber
            else
              echo "$TAG is published with another release.json:"
              cat gh/stored.json
              echo "Not replaced: a failed upload would leave the release without one."
              echo "Repair by hand (delete the asset, upload gh/release.json), or delete the release and run again."
              exit 1
            fi
          else
            gh release upload "$TAG" gh/release.json "${repo[@]}"
          fi
          gh release edit "$TAG" "${repo[@]}" --draft=false

  # The same checked zip on Wago Addons, through its upload API (RELEASING.md,
  # section 2). Only this job sees WAGO_API_TOKEN. A tag from before X-Wago-ID
  # was added (v0.1.1-alpha1 and older) is refused.
  wago:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish != 'github')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Buffy-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Buffy-release-files
          path: out
      - name: Verify tag assets
        run: |
          zip="dist/$ADDON-$TAG-forever.zip"
          test -f "$zip" || { echo "no $zip"; exit 1; }
          jq -e --arg v "$TAG" --arg f "${zip#dist/}" \
            '.releases[0].version == $v and .releases[0].filename == $f' out/release.json > /dev/null ||
            { echo "release.json is not $TAG's:"; cat out/release.json; exit 1; }
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      # Each interface maps to the patch Wago names it by (16001 -> 1.60.1), which
      # must be one Wago lists for Forever. A build Wago doesn't know yet stops here;
      # run the tag again (workflow_dispatch, wago) once Wago lists it.
      - name: Wago upload metadata
        run: |
          id=$(unzip -p "$ZIP" "$ADDON/$ADDON.toc" | tr -d '\r' | sed -n 's/^## X-Wago-ID: *//p' | head -1)
          test -n "$id" || { echo "the packaged TOC has no X-Wago-ID"; exit 1; }
          echo "WAGO_ID=$id" >> "$GITHUB_ENV"
          known=$(curl -sS --fail --retry 3 https://addons.wago.io/api/data/game | jq -c '.patches.forever // []')
          echo "Wago's Forever patches: $known"
          patches=()
          for i in $(jq -r '.releases[0].metadata[].interface' out/release.json); do
            p=$(printf '%d.%d.%d' $((i / 10000)) $((i / 100 % 100)) $((i % 100)))
            jq -e --arg p "$p" 'index($p) != null' <<< "$known" > /dev/null ||
              { echo "Wago lists no Forever patch $p (interface $i)"; exit 1; }
            patches+=("$p")
          done
          case "${TAG,,}" in *alpha*) stability=alpha ;; *beta*) stability=beta ;; *) stability=stable ;; esac
          jq -n --arg label "$TAG" --arg stability "$stability" --rawfile changelog out/notes.md \
            --argjson patches "$(printf '%s\n' "${patches[@]}" | jq -R . | jq -s .)" \
            '{label: $label, stability: $stability, changelog: $changelog,
              supported_forever_patches: $patches}' > out/metadata.json
          cat out/metadata.json
      - name: Upload to Wago Addons
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          test -n "$WAGO_API_TOKEN" || { echo "the WAGO_API_TOKEN secret is not set"; exit 1; }
          code=$(curl -sS --retry 3 --retry-delay 10 -o out/result.json -w '%{http_code}' \
            -H "authorization: Bearer $WAGO_API_TOKEN" \
            -H 'accept: application/json' \
            -F 'metadata=<out/metadata.json' \
            -F "file=@$ZIP" \
            "https://addons.wago.io/api/projects/$WAGO_ID/version")
          echo "HTTP $code"
          case "$code" in
            200|201) echo "uploaded: https://addons.wago.io/addons/$WAGO_ID" ;;
            *) cat out/result.json 2>/dev/null; exit 1 ;;
          esac
