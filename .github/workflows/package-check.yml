name: Package check
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and publish on GitHub
        required: true
permissions:
  contents: read
env:
  ADDON: Buffy
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Fetch pinned libraries
        run: |
          bash tests/fetch_external.sh Libs/LibGlass-1.0 "$RUNNER_TEMP/LibGlass"
          bash tests/fetch_external.sh Libs/LibGroupBuffs-1.0 "$RUNNER_TEMP/LibGroupBuffs"
          echo "LIBGLASS=$RUNNER_TEMP/LibGlass" >> "$GITHUB_ENV"
          echo "LIBGROUPBUFFS=$RUNNER_TEMP/LibGroupBuffs" >> "$GITHUB_ENV"
      - name: Syntax and behavior
        run: |
          luac5.1 -p Buffy*.lua Classes/*.lua "$LIBGROUPBUFFS/LibGroupBuffs.lua"
          for f in tests/test_*.lua; do lua5.1 "$f"; done
      - name: Only the requested tag at HEAD
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for t in $(git tag --points-at HEAD); do
            [ "$t" = "$TAG" ] || git tag -d "$t"
          done
          test "$(git tag --points-at HEAD)" = "$TAG" || { echo "$TAG is not at HEAD"; exit 1; }
      - name: Package without publishing
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d
      - name: Verify exact runtime contents
        run: python3 tests/check_package.py .release/*.zip --lua lua5.1
      - name: Build release notes and release.json
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          zip=$(ls .release/*.zip | head -1)
          tag="$TAG"
          if [ -z "$tag" ]; then
            tag=$(tr -d '\r' < CHANGELOG.md | sed -n 's/^## \(v[^ ]*\).*/\1/p' | head -1)
          fi
          git show "$GITHUB_SHA:tests/release_files.sh" > "$RUNNER_TEMP/release_files.sh"
          bash "$RUNNER_TEMP/release_files.sh" "$tag" "$zip" "$RUNNER_TEMP/release-files"
      - name: Keep checked ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Buffy-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Keep release metadata
        uses: actions/upload-artifact@v4
        with:
          name: Buffy-release-files
          path: ${{ runner.temp }}/release-files/
          if-no-files-found: error

  release:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Buffy-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Buffy-release-files
          path: out
      - name: Verify tag assets
        run: |
          zip="dist/$ADDON-$TAG-forever.zip"
          test -f "$zip" || { echo "no $zip"; exit 1; }
          jq -e --arg v "$TAG" --arg f "${zip#dist/}" \
            '.releases[0].version == $v and .releases[0].filename == $f' out/release.json > /dev/null
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "${TAG,,}" in *alpha*|*beta*) pre=--prerelease ;; esac
          title="$(jq -r '.releases[0].name' out/release.json) ${TAG#v}"
          gh release create "$TAG" "$ZIP" out/release.json --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$title" --notes-file out/notes.md $pre
